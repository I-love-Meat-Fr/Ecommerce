services:
  mongo:
    image: mongo:7.0
    container_name: ecommer-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-ecommer}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecommer-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ecommer-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Prefer Atlas when MONGO_CONNECTION_STRING is set in .env; otherwise
      # fall back to the local Docker mongo container.
      ConnectionStrings__MongoDB: ${MONGO_CONNECTION_STRING:-mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-admin123}@mongo:27017}
      MONGO_CONNECTION_STRING: ${MONGO_CONNECTION_STRING:-}
      DatabaseName: ${MONGO_DB:-ecommer}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ecommer-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommer-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - ecommer-net

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: ecommer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    networks:
      - ecommer-net

volumes:
  mongo_data:
    name: ecommer-mongo-data

networks:
  ecommer-net:
    name: ecommer-network
